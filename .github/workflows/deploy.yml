name: Vérifier et publier

# Le site en ligne accusait trois heures de retard sur `main` parce que la
# publication était manuelle. Elle est désormais automatique : chaque commit
# sur `main` reconstruit et republie le site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # L'APK est construit ici et non sur le Mac de Thibault : il n'a pas le SDK
  # Android, et il n'a pas à l'installer pour obtenir une version testable.
  # Le fichier se télécharge depuis l'onglet Actions, section « Artifacts ».
  android:
    name: Construire l'APK Android
    needs: verifier
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: parlemoi-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publier:
    name: Publier sur GitHub Pages
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Publication par le mécanisme officiel de GitHub plutôt que par un envoi
    # sur la branche gh-pages. Cette dernière déclenchait un second workflow,
    # « pages build and deployment », dont l'étape de déploiement échouait de
    # façon répétée sans journal consultable. Ici, un seul mécanisme construit
    # et publie, et son échec est visible dans ce workflow.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Bascule la source des Pages sur « GitHub Actions » si ce n'est pas
      # déjà le cas, sans passer par les réglages du dépôt.
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `--base-href` : le site est servi depuis /parlemoi/, sans quoi la page
      # se charge mais tous les assets tombent en 404.
      #
      # `--no-web-resources-cdn` : sans cette option, le moteur de rendu (7 Mo)
      # est téléchargé depuis les serveurs de Google à chaque ouverture, et
      # l'application ne démarre pas du tout hors connexion.
      - name: Construire la version web
        run: flutter build web --release --base-href /parlemoi/ --no-web-resources-cdn

      # Flutter ne livre plus qu'un service worker factice qui se désinscrit
      # lui-même. Celui-ci met réellement l'application en cache.
      - name: Générer le cache hors ligne
        run: python3 tool/build_service_worker.py

      - name: Vérifier que le mode d'emploi est bien publié
        run: test -s build/web/mode-emploi.pdf

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Déployer
        id: publication
        uses: actions/deploy-pages@v4
