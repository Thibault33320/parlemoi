name: Vérifier et publier

# Le site en ligne accusait trois heures de retard sur `main` parce que la
# publication était manuelle. Elle est désormais automatique : chaque commit
# sur `main` reconstruit et republie le site.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # L'APK est construit ici et non sur le Mac de Thibault : il n'a pas le SDK
  # Android, et il n'a pas à l'installer pour obtenir une version testable.
  # Le fichier se télécharge depuis l'onglet Actions, section « Artifacts ».
  android:
    name: Construire l'APK Android
    needs: verifier
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: parlemoi-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publier:
    name: Publier sur GitHub Pages
    needs: verifier
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Le site est servi depuis https://thibault33320.github.io/parlemoi/ :
      # sans ce base-href, la page se charge mais tous les assets tombent en 404.
      - name: Construire la version web
        run: flutter build web --release --base-href /parlemoi/

      # Sans ce fichier, GitHub Pages passe le dossier dans Jekyll, qui ignore
      # les fichiers commençant par un underscore.
      - name: Désactiver Jekyll
        run: touch build/web/.nojekyll

      - name: Publier sur la branche gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build/web
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publication depuis ${GITHUB_SHA::7}"
          # Force : gh-pages ne contient que le site construit, jamais de
          # sources. L'historique du code reste entièrement sur main.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
