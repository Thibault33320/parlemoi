name: parlemoi
description: Application de communication par pictogrammes et voix française.
publish_to: "none"
version: 1.4.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalogue.json
    - assets/pictograms/

  # Police embarquée : sans elle, Flutter Web va chercher les emoji couleur sur
  # un CDN Google et Raphaël verrait des carrés vides hors connexion.
  # Réduite aux emoji utilisés par tool/build_emoji_font.py (4,8 Mo -> 383 Ko).
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

    # CanvasKit n'a accès à aucune police système : sans celle-ci, le web va
    # chercher Roboto chez Google et les libellés des cartes risquent de ne
    # pas s'afficher hors connexion. Réduite à l'alphabet français par
    # tool/build_text_font.py (477 Ko -> 3 x 62 Ko).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
